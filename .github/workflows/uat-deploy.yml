name: Deploy backend to isolated UAT

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy on the already provisioned UAT host
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: antifake-backend-uat-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy backend UAT runtime
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: uat
    env:
      UAT_APP_DIR: ${{ vars.UAT_BACKEND_APP_DIR }}
      UAT_APP_NAME: ${{ vars.UAT_BACKEND_APP_NAME }}
      UAT_ENV_FILE: ${{ vars.UAT_BACKEND_ENV_FILE }}
      UAT_HEALTH_URL: ${{ vars.UAT_BACKEND_HEALTH_URL }}
      UAT_HOST_MARKER_PATH: ${{ vars.UAT_HOST_MARKER_PATH }}
      UAT_REF: ${{ inputs.ref }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.UAT_VPS_HOST }}
          username: ${{ secrets.UAT_VPS_USER }}
          key: ${{ secrets.UAT_VPS_SSH_KEY }}
          port: ${{ secrets.UAT_VPS_PORT }}
          command_timeout: 40m
          envs: UAT_APP_DIR,UAT_APP_NAME,UAT_ENV_FILE,UAT_HEALTH_URL,UAT_HOST_MARKER_PATH,UAT_REF
          script: |
            set -Eeuo pipefail
            shopt -s nocasematch

            : "${UAT_APP_DIR:?UAT_BACKEND_APP_DIR is required}"
            : "${UAT_APP_NAME:?UAT_BACKEND_APP_NAME is required}"
            : "${UAT_ENV_FILE:?UAT_BACKEND_ENV_FILE is required}"
            : "${UAT_HEALTH_URL:?UAT_BACKEND_HEALTH_URL is required}"
            : "${UAT_REF:?workflow ref is required}"

            MARKER_PATH="${UAT_HOST_MARKER_PATH:-/etc/antifake/uat-target}"
            if [ ! -r "$MARKER_PATH" ] || [ "$(tr -d '\r\n' < "$MARKER_PATH")" != "antifake-uat" ]; then
              echo "ERROR: remote host is not marked as antifake-uat."
              exit 1
            fi

            case "$UAT_REF" in
              -*|*..*|*[!A-Za-z0-9._/-]*)
                echo "ERROR: UAT ref contains unsafe characters."
                exit 1
                ;;
            esac

            case "$UAT_APP_DIR" in
              *production*|*/var/www/antifake/backend|*/antifake/backend)
                echo "ERROR: UAT backend path looks like the production path."
                exit 1
                ;;
              *uat*|*staging*|*test*) ;;
              *)
                echo "ERROR: UAT backend path must identify an isolated target."
                exit 1
                ;;
            esac

            case "$UAT_APP_NAME" in
              *production*|antifake-api|antifake-backend)
                echo "ERROR: UAT process name collides with a production process."
                exit 1
                ;;
              *uat*|*staging*|*test*) ;;
              *)
                echo "ERROR: UAT process name must identify an isolated target."
                exit 1
                ;;
            esac

            case "$UAT_ENV_FILE" in
              *production*)
                echo "ERROR: UAT environment file looks production-scoped."
                exit 1
                ;;
              *uat*|*staging*|*test*) ;;
              *)
                echo "ERROR: UAT environment file must identify an isolated target."
                exit 1
                ;;
            esac

            case "$UAT_HEALTH_URL" in
              http://127.0.0.1:*|http://localhost:*|https://uat.*|https://staging.*|https://*-uat.*|https://*-staging.*|https://*.uat.*|https://*.staging.*|https://*.test.*) ;;
              *)
                echo "ERROR: UAT health URL is not an explicitly non-production URL."
                exit 1
                ;;
            esac

            cd "$UAT_APP_DIR"

            APP_REALPATH="$(pwd -P)"
            case "$APP_REALPATH" in
              *production*|*/var/www/antifake/backend|*/antifake/backend)
                echo "ERROR: resolved UAT backend path is production-scoped."
                exit 1
                ;;
              *uat*|*staging*|*test*) ;;
              *)
                echo "ERROR: resolved UAT backend path is not isolated."
                exit 1
                ;;
            esac

            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "ERROR: UAT backend checkout has uncommitted changes."
              exit 1
            fi

            git fetch origin "$UAT_REF"
            git checkout "$UAT_REF"
            git pull --ff-only origin "$UAT_REF"

            if [ ! -r "$UAT_ENV_FILE" ]; then
              echo "ERROR: UAT environment file is not readable on the host."
              exit 1
            fi

            ENV_REALPATH="$(realpath -e "$UAT_ENV_FILE")"
            case "$ENV_REALPATH" in
              *production*)
                echo "ERROR: resolved UAT environment file is production-scoped."
                exit 1
                ;;
            esac

            export NODE_ENV=uat
            export UAT_ENVIRONMENT=true
            export UAT_ISOLATION_CONFIRMED=true
            export UAT_ENV_FILE

            npm ci --include=dev
            npm run build:deploy
            npm run uat:reset

            if pm2 describe "$UAT_APP_NAME" >/dev/null 2>&1; then
              pm2 restart "$UAT_APP_NAME" --update-env
            else
              pm2 start npm --name "$UAT_APP_NAME" --cwd "$UAT_APP_DIR" -- run uat:start
            fi
            pm2 save

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 15 \
              --retry-delay 3 \
              --retry-all-errors \
              "$UAT_HEALTH_URL" \
              > /dev/null

            echo "Backend UAT deployment completed: $(git rev-parse HEAD)"
