name: UAT demo fixtures

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: antifake-uat-demo-fixtures
  cancel-in-progress: false

jobs:
  ensure-and-verify:
    name: Ensure and verify approved UAT demo fixtures
    runs-on: ubuntu-latest
    environment: uat
    env:
      ANTIFAKE_CURRENT_ENVIRONMENT: UAT_DEMO
      UAT_DEMO_MUTATION_APPROVED: 'true'
      UAT_DEMO_LEGACY_DATA_ACKNOWLEDGED: ${{ vars.UAT_DEMO_LEGACY_DATA_ACKNOWLEDGED }}
      UAT_DEMO_LEGACY_DATA_CUTOFF: ${{ vars.UAT_DEMO_LEGACY_DATA_CUTOFF }}
      UAT_DEMO_FIXTURE_NAMESPACE: DOCS_UAT
      UAT_DEMO_FIXTURE_MODE: ADDITIVE_IDEMPOTENT
      UAT_DEMO_DESTRUCTIVE_RESET_ALLOWED: 'false'
      UAT_DEMO_LEGACY_MUTATION_ALLOWED: 'false'
      UAT_DEMO_REAL_PAYMENT_ALLOWED: 'false'
      UAT_DEMO_REAL_PAYOUT_ALLOWED: 'false'
      UAT_DEMO_REAL_SHIPMENT_ALLOWED: 'false'
      UAT_DEMO_REAL_EXTERNAL_KYC_ALLOWED: 'false'
      UAT_DEMO_REAL_LIVESTREAM_ALLOWED: 'false'
      DATABASE_URL: ${{ secrets.UAT_DEMO_DATABASE_URL }}
      UAT_DEMO_DATABASE_TARGET: ${{ vars.UAT_DEMO_DATABASE_TARGET }}
      UAT_DEMO_DATABASE_NAME: ${{ vars.UAT_DEMO_DATABASE_NAME }}
      UAT_DEMO_DATABASE_HOST_ALLOWLIST: ${{ vars.UAT_DEMO_DATABASE_HOST_ALLOWLIST }}
      UAT_DEMO_PRODUCTION_DATABASE_TARGET: ${{ vars.UAT_DEMO_PRODUCTION_DATABASE_TARGET }}
      UAT_APPROVED_PUBLIC_HOSTS: antifake.io.vn,www.antifake.io.vn
      UAT_FRONTEND_PUBLIC_URL: https://antifake.io.vn
      UAT_QR_CODE: ${{ secrets.UAT_QR_CODE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Ensure additive fixtures and verify
        run: |
          npm run uat:audit-demo
          npm run uat:ensure
          npm run uat:verify-demo
