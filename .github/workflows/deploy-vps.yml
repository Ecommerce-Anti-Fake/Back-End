name: Deploy backend to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: antifake-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -Eeuo pipefail

            APP_DIR="/var/www/antifake/backend"
            APP_NAME="antifake-backend"
            HEALTH_URL="https://api.antifake.io.vn/api/categories"

            cd "$APP_DIR"

            echo "========================================"
            echo "1. Kiểm tra repository"
            echo "========================================"

            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "ERROR: VPS có thay đổi chưa commit."
              git status --short
              exit 1
            fi

            PREVIOUS_COMMIT="$(git rev-parse HEAD)"
            echo "Phiên bản hiện tại: $PREVIOUS_COMMIT"

            rollback() {
              echo "========================================"
              echo "Deploy thất bại, bắt đầu rollback"
              echo "========================================"

              cd "$APP_DIR"
              git reset --hard "$PREVIOUS_COMMIT"
              npm ci
              npm run build

              pm2 restart "$APP_NAME" --update-env
              pm2 save

              echo "Rollback source code hoàn tất."
            }

            trap rollback ERR

            echo "========================================"
            echo "2. Lấy source code mới"
            echo "========================================"

            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            echo "Phiên bản mới: $(git rev-parse HEAD)"

            echo "========================================"
            echo "3. Cài dependencies"
            echo "========================================"

            npm ci

            echo "========================================"
            echo "4. Build ứng dụng"
            echo "========================================"

            npm run build

            echo "========================================"
            echo "5. Chạy Prisma migration"
            echo "========================================"

            npm run prisma:merge
            npx prisma migrate deploy

            echo "========================================"
            echo "6. Restart ứng dụng"
            echo "========================================"

            pm2 restart "$APP_NAME" --update-env
            pm2 save

            echo "========================================"
            echo "7. Health check"
            echo "========================================"

            sleep 8

            curl \
              --fail \
              --silent \
              --show-error \
              --retry 10 \
              --retry-delay 3 \
              --retry-all-errors \
              "$HEALTH_URL" \
              > /dev/null

            trap - ERR

            echo "========================================"
            echo "Deployment completed successfully."
            echo "Commit: $(git rev-parse HEAD)"
            echo "========================================"