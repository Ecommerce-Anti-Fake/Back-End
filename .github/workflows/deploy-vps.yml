name: Deploy backend to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: antifake-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Record deploy start time
        run: |
          echo "DEPLOY_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 30m
          script: |
            set -Eeuo pipefail

            APP_DIR="/var/www/antifake/backend"
            APP_NAME="antifake-backend"
            HEALTH_URL="https://api.antifake.io.vn/api/health"

            cd "$APP_DIR"

            echo "========================================"
            echo "1. Kiểm tra repository"
            echo "========================================"

            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "ERROR: VPS có thay đổi chưa commit."
              git status --short
              exit 1
            fi

            PREVIOUS_COMMIT="$(git rev-parse HEAD)"
            echo "Phiên bản hiện tại: $PREVIOUS_COMMIT"

            rollback() {
              # Ngăn rollback bị gọi lặp lại nếu chính rollback gặp lỗi.
              trap - ERR
              set +e

              echo "========================================"
              echo "Deploy thất bại, bắt đầu rollback"
              echo "========================================"

              cd "$APP_DIR"

              git reset --hard "$PREVIOUS_COMMIT"

              npm ci
              npm run build

              pm2 restart "$APP_NAME" --update-env
              pm2 save

              echo "Rollback source code hoàn tất."
              exit 1
            }

            trap rollback ERR

            echo "========================================"
            echo "2. Lấy source code mới"
            echo "========================================"

            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            NEW_COMMIT="$(git rev-parse HEAD)"
            echo "Phiên bản mới: $NEW_COMMIT"

            echo "========================================"
            echo "3. Cài dependencies"
            echo "========================================"

            npm ci

            echo "========================================"
            echo "4. Build ứng dụng"
            echo "========================================"

            npm run build

            echo "========================================"
            echo "5. Chạy Prisma migration"
            echo "========================================"

            npm run prisma:merge
            npx prisma migrate deploy

            echo "========================================"
            echo "6. Restart ứng dụng"
            echo "========================================"

            pm2 restart "$APP_NAME" --update-env
            pm2 save

            echo "========================================"
            echo "7. Health check"
            echo "========================================"

            sleep 8

            curl \
              --fail \
              --silent \
              --show-error \
              --retry 10 \
              --retry-delay 3 \
              --retry-all-errors \
              "$HEALTH_URL" \
              > /dev/null

            trap - ERR

            echo "========================================"
            echo "Deployment completed successfully."
            echo "Commit: $NEW_COMMIT"
            echo "========================================"

      - name: Telegram - backend deploy success
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          WORKFLOW: ${{ github.workflow }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          SHORT_SHA="${COMMIT_SHA:0:7}"
          RUN_URL="https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}"

          END_TIME=$(date +%s)
          TOTAL_SECONDS=$((END_TIME - DEPLOY_START))

          HOURS=$((TOTAL_SECONDS / 3600))
          MINUTES=$(((TOTAL_SECONDS % 3600) / 60))
          SECONDS=$((TOTAL_SECONDS % 60))

          if [ "$HOURS" -gt 0 ]; then
            DEPLOY_TIME="${HOURS}h ${MINUTES}m ${SECONDS}s"
          elif [ "$MINUTES" -gt 0 ]; then
            DEPLOY_TIME="${MINUTES}m ${SECONDS}s"
          else
            DEPLOY_TIME="${SECONDS}s"
          fi

          if [ -z "$COMMIT_MESSAGE" ]; then
            COMMIT_MESSAGE="Chạy workflow thủ công hoặc không có nội dung commit"
          fi

          MESSAGE=$(cat <<EOF
          🚀 AntiFake Backend Deploy Thành Công

          🌐 Môi trường: Production

          📦 Repository: ${REPOSITORY}
          🌿 Branch: ${BRANCH}

          🔖 Commit:
          ${SHORT_SHA} - ${COMMIT_MESSAGE}

          👤 Người thực hiện: ${ACTOR}
          🚀 Workflow: ${WORKFLOW}
          🔢 Run: #${RUN_NUMBER}
          ⏱️ Thời gian deploy: ${DEPLOY_TIME}

          🟢 Health Check: PASSED
          🔗 API: https://api.antifake.io.vn

          Chi tiết:
          ${RUN_URL}
          EOF
          )

          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            > /dev/null

      - name: Telegram - backend deploy failed
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          WORKFLOW: ${{ github.workflow }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          SHORT_SHA="${COMMIT_SHA:0:7}"
          RUN_URL="https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}"

          END_TIME=$(date +%s)
          TOTAL_SECONDS=$((END_TIME - DEPLOY_START))

          HOURS=$((TOTAL_SECONDS / 3600))
          MINUTES=$(((TOTAL_SECONDS % 3600) / 60))
          SECONDS=$((TOTAL_SECONDS % 60))

          if [ "$HOURS" -gt 0 ]; then
            DEPLOY_TIME="${HOURS}h ${MINUTES}m ${SECONDS}s"
          elif [ "$MINUTES" -gt 0 ]; then
            DEPLOY_TIME="${MINUTES}m ${SECONDS}s"
          else
            DEPLOY_TIME="${SECONDS}s"
          fi

          if [ -z "$COMMIT_MESSAGE" ]; then
            COMMIT_MESSAGE="Chạy workflow thủ công hoặc không có nội dung commit"
          fi

          MESSAGE=$(cat <<EOF
          ❌ AntiFake Backend Deploy Thất Bại

          🌐 Môi trường: Production

          📦 Repository: ${REPOSITORY}
          🌿 Branch: ${BRANCH}

          🔖 Commit:
          ${SHORT_SHA} - ${COMMIT_MESSAGE}

          👤 Người thực hiện: ${ACTOR}
          🚀 Workflow: ${WORKFLOW}
          🔢 Run: #${RUN_NUMBER}
          ⏱️ Thời gian chạy: ${DEPLOY_TIME}

          🔴 Deploy: FAILED
          🟡 Rollback: Đã kích hoạt quy trình rollback

          Kiểm tra log:
          ${RUN_URL}
          EOF
          )

          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            > /dev/null