name: Deploy backend to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: antifake-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 20m
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="/var/www/antifake/backend"
            cd "$APP_DIR"

            # Không tự xóa thay đổi trực tiếp trên VPS.
            # Deployment sẽ dừng để tránh làm mất cấu hình hoặc mã nguồn chưa commit.
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "ERROR: Repository trên VPS đang có thay đổi chưa commit."
              git status --short
              exit 1
            fi

            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            npm ci
            npm run build

            pm2 restart antifake-backend --update-env
            pm2 save

            sleep 5
            curl --fail --silent --show-error \
              --retry 5 \
              --retry-delay 3 \
              https://api.antifake.io.vn/api/categories \
              > /dev/null

            echo "Deployment completed successfully."
